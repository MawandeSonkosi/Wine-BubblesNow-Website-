<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Wine & Bubbles</title>
    <link rel="icon" type="image/png" href="../assets/categories/Icons.png">
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f8f8f8;
            margin: 0;
            padding: 0;
        }
        
        .success-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: #27ae60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: white;
            font-size: 40px;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            color: #6b0d2b;
            margin-bottom: 16px;
        }
        
        p {
            color: #666;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 16px 32px;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 8px;
        }
        
        .btn-primary {
            background: #6b0d2b;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a0b23;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: white;
            color: #6b0d2b;
            border: 2px solid #6b0d2b;
        }
        
        .btn-secondary:hover {
            background: rgba(107, 13, 43, 0.05);
            transform: translateY(-2px);
        }
        
        /* Countdown timer styles */
        .countdown {
            margin-top: 20px;
            padding: 12px;
            background: rgba(107, 13, 43, 0.05);
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }
        
        .countdown span {
            font-weight: bold;
            color: #6b0d2b;
        }
        
        @media (max-width: 768px) {
            .success-container {
                margin: 40px 16px;
                padding: 24px;
            }
            
            .btn {
                display: block;
                margin: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        
        <h1>Payment Successful!</h1>
        <p>Your payment has been processed successfully. Your order is now confirmed and will be processed shortly.</p>
        <p>A payment receipt and order confirmation have been sent to your email address.</p>
        
        <div>
            <a href="/index.html" class="btn btn-primary" id="homeBtn">
                <i class="fas fa-home"></i> Return to Home
            </a>
            <a href="/order/track_order.html" class="btn btn-secondary">
                <i class="fas fa-shopping-bag"></i> Track Your Order
            </a>
        </div>
        
        <div class="countdown">
            Redirecting to <a href="/index.html" style="color: #6b0d2b;">homepage</a> in <span id="countdown">5</span> seconds...
        </div>
    </div>

    <script>
        // Auto-redirect to homepage after 5 seconds
        let secondsLeft = 5;
        const countdownElement = document.getElementById('countdown');
        const homeBtn = document.getElementById('homeBtn');
        
        const timer = setInterval(() => {
            secondsLeft--;
            if (countdownElement) {
                countdownElement.textContent = secondsLeft;
            }
            
            if (secondsLeft <= 0) {
                clearInterval(timer);
                window.location.href = '/index.html';
            }
        }, 1000);
        
        // Also allow manual click to go home immediately
        if (homeBtn) {
            homeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                clearInterval(timer);
                window.location.href = '/index.html';
            });
        }
    </script>
</body>
</html>
