<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Advert Management | Wine & Bubbles Admin</title>
  <link rel="icon" type="image/png" href="/assets/categories/Icons.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    :root {
      --admin-primary: #6b0d2b;
      --admin-accent: #d4af37;
      --admin-bg: #faf8f5;
      --admin-card: #ffffff;
      --admin-text: #1b1b1b;
      --admin-muted: #6d6d6d;
      --admin-border: #eae3da;
      --admin-success: #2e7d32;
      --admin-warning: #ed6c02;
      --admin-error: #d32f2f;
    }
    
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    
    body { 
      background: var(--admin-bg);
      display: flex;
      flex-direction: column;
    }
    
    .main-nav { display: none !important; }
    .top-icons { margin-left: auto; display: flex; gap: 25px; align-items: center; }
    
    .admin-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .admin-container { 
      max-width: 1400px; 
      margin: 30px auto 0; 
      padding: 0 24px;
      flex: 1;
    }
    
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .page-header h1 { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--admin-text); margin: 0; }
    .page-header h1 i { color: var(--admin-primary); margin-right: 12px; }
    
    .btn-primary { background: var(--admin-primary); color: white; border: none; padding: 12px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Montserrat', sans-serif; font-size: 14px; }
    .btn-primary:hover { background: #8a1e3d; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(107,13,43,0.2); }
    .btn-secondary { background: transparent; border: 1px solid var(--admin-border); padding: 12px 24px; border-radius: 40px; cursor: pointer; font-weight: 500; }
    .btn-secondary:hover { background: #f5f5f5; }
    
    .search-bar { background: white; border-radius: 50px; padding: 8px 20px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--admin-border); width: 280px; }
    .search-bar i { color: var(--admin-primary); }
    .search-bar input { border: none; flex: 1; outline: none; font-size: 14px; background: transparent; font-family: 'Montserrat', sans-serif; }
    
    .filter-bar {
      background: white;
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 24px;
      border: 1px solid var(--admin-border);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }
    
    .filter-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .filter-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--admin-text);
    }
    
    .filter-select {
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid var(--admin-border);
      background: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      cursor: pointer;
    }
    
    .stats-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-box { background: var(--admin-card); border-radius: 16px; padding: 16px 20px; flex: 1; min-width: 150px; border: 1px solid var(--admin-border); display: flex; align-items: center; gap: 12px; }
    .stat-box i { font-size: 28px; color: var(--admin-primary); }
    .stat-box-info { flex: 1; }
    .stat-box-value { font-size: 24px; font-weight: 700; color: var(--admin-text); }
    .stat-box-label { font-size: 12px; color: var(--admin-muted); }
    
    /* Improved Advert Grid and Cards - Wine Card Style */
    .advert-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
      gap: 24px; 
      margin-bottom: 30px;
    }
    
    .advert-card { 
      background: var(--admin-card); 
      border-radius: 20px; 
      border: 1px solid var(--admin-border); 
      overflow: hidden; 
      transition: all 0.3s ease; 
      cursor: pointer;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 450px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    
    .advert-card:hover { 
      transform: translateY(-6px); 
      box-shadow: 0 12px 28px rgba(107,13,43,0.12);
      border-color: var(--admin-primary);
    }
    
    /* FIXED: Wine Card Image Container - Shows full image like All Wines page */
    .advert-image { 
      width: 100%; 
      height: 260px; 
      background: linear-gradient(135deg, #faf8f5, #f5f0eb);
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden;
      position: relative;
      padding: 16px;
    }
    
    .advert-image img { 
      width: auto; 
      max-width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
      object-position: center;
      transition: transform 0.4s ease;
      display: block;
      margin: 0 auto;
    }
    
    .advert-card:hover .advert-image img {
      transform: scale(1.05);
    }
    
    /* Placeholder for missing images */
    .advert-image-placeholder { 
      display: flex;
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      width: 100%; 
      height: 100%; 
      background: linear-gradient(135deg, rgba(107,13,43,0.06), rgba(107,13,43,0.12));
      color: var(--admin-primary); 
      text-align: center;
      padding: 20px;
    }
    
    .advert-image-placeholder i {
      font-size: 64px;
      margin-bottom: 12px;
      opacity: 0.6;
    }
    
    .advert-image-placeholder span {
      font-size: 13px;
      color: var(--admin-muted);
      font-weight: 500;
    }
    
    /* Card Header */
    .advert-header { 
      padding: 14px 16px; 
      background: #faf8f5; 
      border-bottom: 1px solid var(--admin-border); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-wrap: wrap; 
      gap: 10px; 
    }
    
    .advert-title { 
      font-weight: 700; 
      font-size: 16px; 
      color: var(--admin-text); 
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    /* Badges */
    .badge { 
      padding: 4px 10px; 
      border-radius: 20px; 
      font-size: 10px; 
      font-weight: 600; 
      white-space: nowrap; 
    }
    .badge-active { background: rgba(46,125,50,0.12); color: #2e7d32; }
    .badge-inactive { background: rgba(211,47,47,0.12); color: #d32f2f; }
    .badge-purchasable { background: rgba(33,150,243,0.12); color: #1976d2; }
    .badge-display { background: rgba(255,152,0,0.12); color: #ed6c02; }
    
    /* Card Body */
    .advert-body { 
      padding: 14px 16px; 
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .advert-subtitle { 
      font-size: 13px; 
      color: var(--admin-muted); 
      margin-bottom: 14px; 
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 36px;
    }
    
    /* Stats Chips */
    .advert-stats { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 14px; 
      flex-wrap: wrap; 
    }
    
    .stat-chip { 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      background: rgba(107,13,43,0.06); 
      padding: 5px 12px; 
      border-radius: 20px; 
      font-size: 12px; 
      font-weight: 500;
      color: var(--admin-primary); 
    }
    
    .stat-chip i {
      font-size: 12px;
      opacity: 0.8;
    }
    
    /* Pricing and Stock */
    .advert-price { 
      font-weight: 800; 
      color: var(--admin-primary); 
      font-size: 20px; 
      margin: 8px 0 6px;
    }
    
    .stock-info { 
      font-size: 12px; 
      font-weight: 500;
      color: var(--admin-success); 
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .stock-info i {
      font-size: 11px;
    }
    
    .stock-info.out-of-stock { 
      color: var(--admin-error); 
    }
    
    /* Card Actions */
    .advert-actions { 
      padding: 12px 16px; 
      display: flex; 
      gap: 12px; 
      justify-content: flex-end; 
      border-top: 1px solid var(--admin-border); 
      background: #faf8f5;
    }
    
    .icon-btn { 
      background: none; 
      border: none; 
      font-size: 13px; 
      cursor: pointer; 
      padding: 6px 14px; 
      border-radius: 30px; 
      transition: all 0.2s; 
      color: var(--admin-muted); 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      font-family: 'Montserrat', sans-serif; 
      font-weight: 500;
    }
    
    .icon-btn i { 
      font-size: 13px; 
    }
    
    .icon-btn:hover { 
      background: rgba(107,13,43,0.1); 
      color: var(--admin-primary); 
    }
    
    .icon-btn.danger:hover { 
      background: rgba(211,47,47,0.1); 
      color: var(--admin-error); 
    }
    
    /* Loading and Empty States */
    .loading-state, .empty-state { 
      text-align: center; 
      padding: 60px; 
      color: var(--admin-muted); 
      background: white; 
      border-radius: 24px; 
      border: 1px solid var(--admin-border); 
    }
    
    .loading-spinner { 
      width: 45px; 
      height: 45px; 
      border: 3px solid rgba(107,13,43,0.1); 
      border-top-color: var(--admin-primary); 
      border-radius: 50%; 
      animation: spin 1s linear infinite; 
      margin: 0 auto 16px; 
    }
    
    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }
    
    /* FAB Button */
    .fab { 
      position: fixed; 
      bottom: 30px; 
      right: 30px; 
      width: 60px; 
      height: 60px; 
      background: var(--admin-primary); 
      color: white; 
      border: none; 
      border-radius: 50%; 
      font-size: 26px; 
      cursor: pointer; 
      box-shadow: 0 6px 16px rgba(107,13,43,0.3); 
      transition: all 0.3s; 
      z-index: 100; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    
    .fab:hover { 
      background: #8a1e3d; 
      transform: scale(1.08) rotate(90deg);
      box-shadow: 0 8px 24px rgba(107,13,43,0.4);
    }
    
    /* Footer */
    .footer { 
      margin-top: auto; 
      background: var(--admin-primary);
    }
    
    /* Responsive */
    @media (max-width: 1100px) { 
      .advert-grid { 
        grid-template-columns: repeat(2, 1fr); 
      } 
    }
    
    @media (max-width: 768px) {
      .admin-container { padding: 0 16px; margin-top: 20px; }
      .advert-grid { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: stretch; }
      .search-bar { width: 100%; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .filter-group { justify-content: space-between; }
      .fab { bottom: 20px; right: 20px; width: 52px; height: 52px; font-size: 22px; }
      .stats-row { flex-direction: column; }
      .advert-image { height: 220px; }
      .advert-card { min-height: 420px; }
    }
  </style>
</head>
<body>
  <div class="topbar-top"><div class="topbar-top-inner"></div></div>
  <div class="topbar-main">
    <div class="topbar-main-inner">
      <div class="logo"><a href="/admin/admin_dashboard.html"><img src="/assets/categories/Logo_Top.png" alt="Logo"></a></div>
      <div class="top-icons"><a href="#" id="userIcon"><i class="fas fa-user-circle" style="font-size:24px; color:#6b0d2b;"></i></a></div>
    </div>
  </div>

  <div class="admin-wrapper">
    <div class="admin-container">
      <div class="page-header">
        <div style="display: flex; align-items: center; gap: 20px;">
          <a href="/admin/admin_dashboard.html" style="color: var(--admin-primary); text-decoration: none;"><i class="fas fa-arrow-left"></i> Back</a>
          <h1><i class="fas fa-ad"></i> Advert Management</h1>
        </div>
        <div class="search-bar"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search adverts..."></div>
      </div>
      
      <div class="filter-bar">
        <div class="filter-group">
          <label><i class="fas fa-filter"></i> Status:</label>
          <select id="statusFilter" class="filter-select">
            <option value="all">All</option>
            <option value="active">Active Only</option>
            <option value="inactive">Inactive Only</option>
          </select>
        </div>
        <div class="filter-group">
          <label><i class="fas fa-tag"></i> Type:</label>
          <select id="typeFilter" class="filter-select">
            <option value="all">All Types</option>
            <option value="homepage">Homepage</option>
            <option value="occasion">Occasion</option>
            <option value="category">Category</option>
            <option value="featured">Featured</option>
            <option value="marketing">Marketing</option>
          </select>
        </div>
        <div class="filter-group">
          <label><i class="fas fa-shopping-cart"></i> Purchase:</label>
          <select id="purchaseFilter" class="filter-select">
            <option value="all">All</option>
            <option value="purchasable">Purchasable Only</option>
            <option value="display">Display Only</option>
          </select>
        </div>
        <button id="clearFiltersBtn" class="btn-secondary" style="padding: 8px 20px; margin-left: auto;"><i class="fas fa-times"></i> Clear Filters</button>
      </div>
      
      <div id="statsContainer" class="stats-row"></div>
      <div id="advertContainer"><div class="loading-state"><div class="loading-spinner"></div><p>Loading adverts...</p></div></div>
    </div>
  </div>

  <button class="fab" id="addAdvertBtn"><i class="fas fa-plus"></i></button>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <img src="/assets/categories/Logo_Botttom.png" class="footer-logo">
        <p class="brand-tagline">Admin Panel — Advert Management</p>
      </div>
    </div>
  </footer>

  <script src="/admin/advert_management/advert_management.js?v=5"></script>
</body>
</html>
