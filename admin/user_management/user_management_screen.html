<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>User Management | Wine & Bubbles Admin</title>
  <link rel="icon" type="image/png" href="../../assets/categories/Icons.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../../style.css" />
  <style>
    :root {
      --admin-primary: #6b0d2b;
      --admin-accent: #d4af37;
      --admin-bg: #faf8f5;
      --admin-card: #ffffff;
      --admin-text: #1b1b1b;
      --admin-muted: #6d6d6d;
      --admin-border: #eae3da;
      --admin-success: #2e7d32;
      --admin-warning: #ed6c02;
      --admin-error: #d32f2f;
    }
    body { background: var(--admin-bg); }
    .main-nav { display: none !important; }
    .top-icons { margin-left: auto; display: flex; gap: 25px; align-items: center; }
    .admin-container { max-width: 1400px; margin: 30px auto 50px; padding: 0 24px; }
    
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .page-header h1 { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--admin-text); margin: 0; }
    .page-header h1 i { color: var(--admin-primary); margin-right: 12px; }
    
    .btn-primary { background: var(--admin-primary); color: white; border: none; padding: 12px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Montserrat', sans-serif; font-size: 14px; }
    .btn-primary:hover { background: #8a1e3d; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(107,13,43,0.2); }
    
    .search-bar { background: white; border-radius: 50px; padding: 8px 20px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--admin-border); width: 300px; }
    .search-bar i { color: var(--admin-primary); }
    .search-bar input { border: none; flex: 1; outline: none; font-size: 14px; background: transparent; font-family: 'Montserrat', sans-serif; }
    
    .users-grid { display: flex; flex-direction: column; gap: 12px; }
    .user-card { background: var(--admin-card); border-radius: 20px; border: 1px solid var(--admin-border); padding: 20px 24px; transition: all 0.2s; cursor: pointer; }
    .user-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.08); transform: translateY(-2px); }
    .user-card-main { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .user-avatar { width: 56px; height: 56px; background: var(--admin-primary); border-radius: 28px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 24px; font-family: 'Playfair Display', serif; flex-shrink: 0; }
    .user-info { flex: 1; min-width: 200px; }
    .user-name { font-weight: 700; font-size: 18px; color: var(--admin-text); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .user-email { font-size: 14px; color: var(--admin-muted); margin-top: 4px; }
    .user-email i { margin-right: 6px; color: var(--admin-primary); width: 16px; }
    .user-meta { display: flex; gap: 20px; margin-top: 8px; font-size: 13px; color: var(--admin-muted); flex-wrap: wrap; }
    .user-meta i { margin-right: 6px; width: 14px; }
    
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-admin { background: rgba(107,13,43,0.1); color: var(--admin-primary); }
    .badge-verified { background: rgba(46,125,50,0.1); color: var(--admin-success); }
    .badge-pending { background: rgba(237,108,2,0.1); color: var(--admin-warning); }
    
    .user-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 8px; border-radius: 40px; transition: 0.2s; color: var(--admin-muted); width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: rgba(107,13,43,0.1); color: var(--admin-primary); }
    .icon-btn.danger:hover { background: rgba(211,47,47,0.1); color: var(--admin-error); }
    
    .loading-state, .empty-state { text-align: center; padding: 60px; color: var(--admin-muted); background: white; border-radius: 24px; border: 1px solid var(--admin-border); }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(107,13,43,0.1); border-top-color: var(--admin-primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; border-radius: 24px; max-width: 500px; width: 90%; padding: 28px; max-height: 80vh; overflow-y: auto; }
    .detail-row { display: flex; padding: 10px 0; border-bottom: 1px solid var(--admin-border); }
    .detail-label { width: 120px; font-weight: 600; color: var(--admin-text); }
    .detail-value { flex: 1; color: var(--admin-muted); }
    
    @media (max-width: 768px) { 
      .admin-container { padding: 0 16px; } 
      .search-bar { width: 100%; } 
      .user-card-main { flex-direction: column; align-items: flex-start; } 
      .user-actions { align-self: flex-end; } 
    }
  </style>
</head>
<body>
  <div class="topbar-top"><div class="topbar-top-inner"></div></div>
  <div class="topbar-main">
    <div class="topbar-main-inner">
      <div class="logo"><a href="../admin_dashboard.html"><img src="../../assets/categories/Logo_Top.png" alt="Logo"></a></div>
      <div class="top-icons"><a href="#" id="userIcon"><i class="fas fa-user-circle" style="font-size:24px; color:#6b0d2b;"></i></a></div>
    </div>
  </div>

  <div class="admin-container">
    <div class="page-header">
      <h1><i class="fas fa-users"></i> User Management</h1>
      <div style="display: flex; gap: 16px; flex-wrap: wrap;">
        <div class="search-bar"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search by name, email or phone..."></div>
        <button class="btn-primary" id="addUserBtn"><i class="fas fa-plus"></i> Add User</button>
      </div>
    </div>
    <div id="usersContainer" class="users-grid"><div class="loading-state"><div class="loading-spinner"></div><p>Loading users...</p></div></div>
  </div>

  <footer class="footer"><div class="container footer-inner"><div class="footer-brand"><img src="../../assets/categories/Logo_Botttom.png" class="footer-logo"><p class="brand-tagline">Admin Panel — User Management</p></div></div></footer>

  <script>
    // ========== USER MANAGEMENT JAVASCRIPT ==========
    const API_BASE = window.location.origin;
    let allUsers = [];
    let searchQuery = '';

    // Check authentication
    function checkAuth() {
        const token = localStorage.getItem('wineBubbles_token');
        const isAdmin = localStorage.getItem('wineBubbles_isAdmin') === 'true';
        
        if (!token || !isAdmin) {
            alert('Admin access required. Please log in as admin.');
            window.location.href = '../../login/login.html';
            return false;
        }
        return true;
    }

    // Fetch users from API
    async function fetchUsers() {
        const container = document.getElementById('usersContainer');
        container.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><p>Loading users...</p></div>';
        
        try {
            const token = localStorage.getItem('wineBubbles_token');
            const response = await fetch(`${API_BASE}/api/users`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const data = await response.json();
            console.log('API Response:', data);
            
            // Extract users from { success: true, data: [...] }
            if (data.success && Array.isArray(data.data)) {
                allUsers = data.data;
            } else if (Array.isArray(data)) {
                allUsers = data;
            } else {
                allUsers = [];
            }
            
            renderUsers();
        } catch (error) {
            console.error('Error:', error);
            container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle" style="font-size:48px; margin-bottom:16px; color:#d32f2f;"></i><p>Error loading users: ${error.message}</p><button class="btn-primary" onclick="fetchUsers()" style="margin-top:16px;">Retry</button></div>`;
        }
    }

    // Render users list
    function renderUsers() {
        const container = document.getElementById('usersContainer');
        
        let filtered = allUsers.filter(user => {
            if (!searchQuery) return true;
            const q = searchQuery.toLowerCase();
            return (user.fullName || '').toLowerCase().includes(q) ||
                   (user.email || '').toLowerCase().includes(q) ||
                   (user.phoneNumber || '').includes(q);
        });
        
        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-users-slash" style="font-size:48px; margin-bottom:16px;"></i><p>No users found</p></div>`;
            return;
        }
        
        container.innerHTML = filtered.map(user => `
            <div class="user-card" onclick="viewUserDetails('${user.id}')">
                <div class="user-card-main">
                    <div class="user-avatar">${(user.fullName?.[0] || 'U').toUpperCase()}</div>
                    <div class="user-info">
                        <div class="user-name">
                            ${escapeHtml(user.fullName || '—')}
                            ${user.isAdmin ? '<span class="badge badge-admin">ADMIN</span>' : ''}
                            ${user.isVerified ? '<span class="badge badge-verified">Verified</span>' : '<span class="badge badge-pending">Pending</span>'}
                        </div>
                        <div class="user-email"><i class="fas fa-envelope"></i> ${escapeHtml(user.email)}</div>
                        <div class="user-meta">
                            <span><i class="fas fa-phone"></i> ${escapeHtml(user.phoneNumber || '—')}</span>
                            <span><i class="fas fa-calendar-alt"></i> Joined: ${formatDate(user.createdAt)}</span>
                        </div>
                    </div>
                    <div class="user-actions" onclick="event.stopPropagation()">
                        <button class="icon-btn" onclick="viewUserDetails('${user.id}')" title="View"><i class="fas fa-eye"></i></button>
                        <button class="icon-btn" onclick="editUser('${user.id}')" title="Edit"><i class="fas fa-edit"></i></button>
                        <button class="icon-btn" onclick="toggleAdmin('${user.id}', ${!user.isAdmin})" title="${user.isAdmin ? 'Remove Admin' : 'Make Admin'}"><i class="fas fa-user-shield"></i></button>
                        <button class="icon-btn" onclick="toggleVerify('${user.id}', ${!user.isVerified})" title="${user.isVerified ? 'Unverify' : 'Verify'}"><i class="fas fa-check-circle"></i></button>
                        <button class="icon-btn danger" onclick="deleteUserPrompt('${user.id}', '${escapeHtml(user.fullName)}')" title="Delete"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // Helper functions
    function formatDate(dateStr) {
        if (!dateStr) return '—';
        try {
            const d = new Date(dateStr);
            return d.toLocaleDateString();
        } catch(e) { return '—'; }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.textContent = message;
        toast.style.cssText = `position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:${type === 'success' ? '#2e7d32' : '#d32f2f'}; color:white; padding:12px 24px; border-radius:40px; z-index:10002; font-family:Montserrat; font-size:14px;`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // View user details
    window.viewUserDetails = async function(userId) {
        try {
            const token = localStorage.getItem('wineBubbles_token');
            const response = await fetch(`${API_BASE}/api/users/${userId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            const user = data.data || data;
            
            const modalHtml = `
                <div class="modal-overlay" onclick="this.remove()">
                    <div class="modal-content" onclick="event.stopPropagation()">
                        <h3><i class="fas fa-user-circle"></i> User Details</h3>
                        <div class="detail-row"><div class="detail-label">Name:</div><div class="detail-value">${escapeHtml(user.fullName)}</div></div>
                        <div class="detail-row"><div class="detail-label">Email:</div><div class="detail-value">${escapeHtml(user.email)}</div></div>
                        <div class="detail-row"><div class="detail-label">Phone:</div><div class="detail-value">${escapeHtml(user.phoneNumber || '—')}</div></div>
                        <div class="detail-row"><div class="detail-label">Admin:</div><div class="detail-value">${user.isAdmin ? 'Yes' : 'No'}</div></div>
                        <div class="detail-row"><div class="detail-label">Verified:</div><div class="detail-value">${user.isVerified ? 'Yes' : 'No'}</div></div>
                        <div class="detail-row"><div class="detail-label">Joined:</div><div class="detail-value">${formatDate(user.createdAt)}</div></div>
                        <div style="display:flex; gap:12px; margin-top:24px;">
                            <button class="btn-primary" onclick="editUser('${userId}')" style="flex:1;">Edit</button>
                            <button onclick="document.querySelector('.modal-overlay')?.remove()" style="background:#f0f0f0; border:none; padding:12px 20px; border-radius:40px;">Close</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        } catch(error) {
            showToast('Could not load user details', 'error');
        }
    };

    window.editUser = function(userId) {
        window.location.href = `user_edit_screen.html?id=${userId || ''}`;
    };

    window.toggleAdmin = async function(userId, newStatus) {
        if (!confirm(`Are you sure you want to ${newStatus ? 'make admin' : 'remove admin'}?`)) return;
        try {
            const token = localStorage.getItem('wineBubbles_token');
            await fetch(`${API_BASE}/api/users/${userId}/admin`, {
                method: 'PATCH',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ isAdmin: newStatus })
            });
            showToast('Admin status updated', 'success');
            fetchUsers();
        } catch(error) {
            showToast('Failed to update', 'error');
        }
    };

    window.toggleVerify = async function(userId, newStatus) {
        if (!confirm(`Verify this user?`)) return;
        try {
            const token = localStorage.getItem('wineBubbles_token');
            await fetch(`${API_BASE}/api/users/${userId}/verify`, {
                method: 'PATCH',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ isVerified: newStatus })
            });
            showToast(`User ${newStatus ? 'verified' : 'unverified'}`, 'success');
            fetchUsers();
        } catch(error) {
            showToast('Failed to update', 'error');
        }
    };

    window.deleteUserPrompt = function(userId, userName) {
        if (confirm(`⚠️ Permanently delete ${userName}? This cannot be undone.`)) {
            deleteUser(userId);
        }
    };

    async function deleteUser(userId) {
        try {
            const token = localStorage.getItem('wineBubbles_token');
            await fetch(`${API_BASE}/api/users/${userId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            showToast('User deleted', 'success');
            fetchUsers();
        } catch(error) {
            showToast('Delete failed', 'error');
        }
    }

    // Search and initialization
    document.getElementById('searchInput')?.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderUsers();
    });
    
    document.getElementById('addUserBtn')?.addEventListener('click', () => {
        window.location.href = 'user_edit_screen.html';
    });

    if (checkAuth()) {
        fetchUsers();
    }
  </script>
</body>
</html>
