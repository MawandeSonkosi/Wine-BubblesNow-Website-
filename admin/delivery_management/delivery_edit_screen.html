<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Edit Delivery | Wine & Bubbles Admin</title>
  <link rel="icon" type="image/png" href="../../assets/categories/Icons.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../../style.css" />
  <style>
    :root {
      --admin-primary: #6b0d2b;
      --admin-accent: #d4af37;
      --admin-bg: #faf8f5;
      --admin-card: #ffffff;
      --admin-text: #1b1b1b;
      --admin-muted: #6d6d6d;
      --admin-border: #eae3da;
      --admin-success: #2e7d32;
      --admin-warning: #ed6c02;
      --admin-error: #d32f2f;
      --admin-info: #0288d1;
    }
    body { background: var(--admin-bg); }
    .main-nav { display: none !important; }
    .top-icons { margin-left: auto; display: flex; gap: 25px; align-items: center; }
    .admin-container { max-width: 900px; margin: 30px auto 50px; padding: 0 24px; }
    
    .form-card { background: var(--admin-card); border-radius: 24px; border: 1px solid var(--admin-border); padding: 32px; }
    .form-title { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--admin-text); margin-bottom: 8px; }
    .form-subtitle { color: var(--admin-muted); margin-bottom: 32px; font-size: 14px; }
    .info-section { margin-bottom: 24px; }
    .info-section h3 { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--admin-primary); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--admin-border); }
    .info-row { display: flex; padding: 8px 0; border-bottom: 1px solid var(--admin-border); }
    .info-label { width: 140px; font-weight: 600; color: var(--admin-text); }
    .info-value { flex: 1; color: var(--admin-muted); }
    
    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--admin-text); font-size: 14px; }
    .form-label i { margin-right: 8px; color: var(--admin-primary); }
    .form-input, .status-select, .driver-select { width: 100%; padding: 14px 16px; border: 1px solid var(--admin-border); border-radius: 12px; font-size: 15px; font-family: 'Montserrat', sans-serif; background: white; cursor: pointer; }
    .form-input:focus, .status-select:focus, .driver-select:focus { outline: none; border-color: var(--admin-primary); }
    textarea.form-input { resize: vertical; min-height: 80px; cursor: text; }
    
    .btn-primary { background: var(--admin-primary); color: white; border: none; padding: 14px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; width: 100%; font-family: 'Montserrat', sans-serif; font-size: 15px; transition: all 0.2s; }
    .btn-primary:hover { background: #8a1e3d; transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-danger { background: transparent; border: 1px solid var(--admin-error); color: var(--admin-error); margin-top: 16px; }
    .btn-danger:hover { background: rgba(211,47,47,0.1); }
    .btn-secondary { background: transparent; border: 1px solid var(--admin-border); padding: 12px 24px; border-radius: 40px; cursor: pointer; font-weight: 500; margin-top: 16px; width: 100%; }
    
    .form-actions { display: flex; gap: 16px; margin-top: 32px; flex-direction: column; }
    
    .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .loading-spinner { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .error-message { background: rgba(211,47,47,0.1); border: 1px solid var(--admin-error); border-radius: 12px; padding: 14px; margin-bottom: 24px; color: var(--admin-error); }
    .warning-message { background: rgba(237,108,2,0.1); border: 1px solid var(--admin-warning); border-radius: 12px; padding: 14px; margin-bottom: 24px; color: var(--admin-warning); }
    .info-message { background: rgba(2,136,209,0.1); border: 1px solid var(--admin-info); border-radius: 12px; padding: 14px; margin-bottom: 24px; color: var(--admin-info); }
    .success-message { background: rgba(46,125,50,0.1); border: 1px solid var(--admin-success); border-radius: 12px; padding: 14px; margin-bottom: 24px; color: var(--admin-success); }
    
    .driver-info { margin-top: 8px; padding: 10px; background: #f8f7f5; border-radius: 8px; font-size: 12px; color: var(--admin-muted); }
    
    /* Status badge styles */
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge.order-received { background: rgba(107,13,43,0.1); color: var(--admin-primary); }
    .status-badge.processing { background: rgba(237,108,2,0.1); color: var(--admin-warning); }
    .status-badge.out-for-delivery { background: rgba(2,136,209,0.1); color: var(--admin-info); }
    .status-badge.delivered { background: rgba(46,125,50,0.1); color: var(--admin-success); }
    .status-badge.cancelled { background: rgba(211,47,47,0.1); color: var(--admin-error); }
    
    @media (max-width: 768px) { 
      .form-card { padding: 24px; } 
      .info-row { flex-direction: column; gap: 4px; } 
      .info-label { width: auto; }
      .admin-container { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <div class="topbar-top"><div class="topbar-top-inner"></div></div>
  <div class="topbar-main">
    <div class="topbar-main-inner">
      <div class="logo"><a href="../admin_dashboard.html"><img src="../../assets/categories/Logo_Top.png" alt="Logo"></a></div>
      <div class="top-icons"><a href="#" id="userIcon"><i class="fas fa-user-circle" style="font-size:24px; color:#6b0d2b;"></i></a></div>
    </div>
  </div>

  <div class="admin-container">
    <div class="form-card">
      <h1 class="form-title" id="formTitle">Edit Delivery</h1>
      <p class="form-subtitle" id="formSubtitle">Update delivery status, assign driver, or cancel order</p>
      
      <div id="errorContainer" class="error-message" style="display:none;"></div>
      <div id="warningContainer" class="warning-message" style="display:none;"></div>
      <div id="infoContainer" class="info-message" style="display:none;"></div>
      <div id="successContainer" class="success-message" style="display:none;"></div>
      <div id="loadingContainer" style="display:none;"><div class="loading-overlay"><div class="loading-spinner"></div></div></div>
      
      <div id="deliveryInfo"></div>
      
      <!-- Status Update Section -->
      <div class="form-group">
        <label class="form-label"><i class="fas fa-tag"></i> Update Status</label>
        <select id="statusSelect" class="status-select">
          <option value="">-- Select new status --</option>
        </select>
        <div id="statusInfo" class="info-message" style="display:none; margin-top: 8px; font-size: 12px;"></div>
      </div>
      
      <!-- Driver Assignment Section -->
      <div class="form-group">
        <label class="form-label"><i class="fas fa-truck"></i> Assign Driver</label>
        <select id="driverSelect" class="driver-select">
          <option value="">-- No driver assigned --</option>
        </select>
        <div id="driverInfo" class="driver-info" style="display:none;"></div>
        <div id="driverLoading" style="display:none; margin-top: 8px; font-size: 12px; color: var(--admin-info);">
          <i class="fas fa-spinner fa-pulse"></i> Loading drivers...
        </div>
      </div>
      
      <div class="form-actions">
        <button class="btn-primary" id="updateBtn"><i class="fas fa-save"></i> Save Changes</button>
        <button class="btn-secondary" onclick="window.location.href='delivery_management_screen.html'"><i class="fas fa-arrow-left"></i> Back to Deliveries</button>
        <button class="btn-secondary btn-danger" id="deleteBtn" style="display:none;"><i class="fas fa-trash-alt"></i> Delete Delivery</button>
      </div>
    </div>
  </div>

  <footer class="footer"><div class="container footer-inner"><div class="footer-brand"><img src="../../assets/categories/Logo_Botttom.png" class="footer-logo"><p class="brand-tagline">Admin Panel — Edit Delivery</p></div></div></footer>

  <script>
    // Delivery Edit JavaScript - Complete working version with driver assignment
    const API_BASE = window.location.origin;
    const urlParams = new URLSearchParams(window.location.search);
    const deliveryId = urlParams.get('id');

    let allUsers = [];
    let allDrivers = [];
    let deliveryData = null;
    let originalStatus = '';

    // ========== AUTHENTICATION ==========
    function checkAuth() {
        const token = localStorage.getItem('wineBubbles_token');
        const isAdmin = localStorage.getItem('wineBubbles_isAdmin') === 'true';
        
        if (!token || !isAdmin) {
            alert('Admin access required');
            window.location.href = '../../login/login.html';
            return false;
        }
        return true;
    }

    // ========== FETCH USERS ==========
    async function fetchUsers() {
        try {
            const token = localStorage.getItem('wineBubbles_token');
            const response = await fetch(`${API_BASE}/api/users?limit=1000`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                const data = await response.json();
                allUsers = data.data || (Array.isArray(data) ? data : []);
                console.log('✅ Loaded users:', allUsers.length);
            }
        } catch (error) {
            console.error('Error fetching users:', error);
        }
    }

    // ========== FETCH DRIVERS ==========
    async function fetchDrivers() {
        const driverLoading = document.getElementById('driverLoading');
        if (driverLoading) driverLoading.style.display = 'block';
        
        try {
            const token = localStorage.getItem('wineBubbles_token');
            const response = await fetch(`${API_BASE}/api/drivers?limit=1000`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (response.ok) {
                const data = await response.json();
                const drivers = data.data || (Array.isArray(data) ? data : []);
                // Filter only active drivers
                allDrivers = drivers.filter(driver => driver.isDriver === true);
                console.log('✅ Loaded drivers:', allDrivers.length);
                
                allDrivers.forEach(driver => {
                    console.log(`  Driver: ${driver.fullName} (ID: ${driver.id})`);
                });
                
                populateDriverSelect();
            } else {
                console.error('Failed to fetch drivers, status:', response.status);
                allDrivers = [];
                populateDriverSelect();
            }
        } catch (error) {
            console.error('Error fetching drivers:', error);
            allDrivers = [];
            populateDriverSelect();
        } finally {
            if (driverLoading) driverLoading.style.display = 'none';
        }
    }

    function populateDriverSelect() {
        const driverSelect = document.getElementById('driverSelect');
        if (!driverSelect) {
            console.log('Driver select element not found');
            return;
        }
        
        driverSelect.innerHTML = '<option value="">-- No driver assigned --</option>';
        
        if (allDrivers.length === 0) {
            driverSelect.innerHTML = '<option value="">-- No drivers available --</option>';
            const driverInfo = document.getElementById('driverInfo');
            if (driverInfo) {
                driverInfo.style.display = 'block';
                driverInfo.innerHTML = '<i class="fas fa-info-circle"></i> No active drivers found. Please add drivers in Driver Management.';
                driverInfo.style.background = 'rgba(2,136,209,0.1)';
                driverInfo.style.color = 'var(--admin-info)';
            }
            return;
        }
        
        allDrivers.forEach(driver => {
            const option = document.createElement('option');
            option.value = driver.id;
            let displayText = driver.fullName;
            if (driver.phoneNumber) displayText += ` - ${driver.phoneNumber}`;
            if (driver.vehicleInfo) displayText += ` (${driver.vehicleInfo})`;
            option.textContent = displayText;
            driverSelect.appendChild(option);
        });
        
        // Set selected driver if delivery has one
        if (deliveryData && deliveryData.driverId) {
            driverSelect.value = deliveryData.driverId;
            const driverInfo = document.getElementById('driverInfo');
            if (driverInfo && deliveryData.driverId) {
                const driver = allDrivers.find(d => d.id == deliveryData.driverId);
                if (driver) {
                    driverInfo.style.display = 'block';
                    driverInfo.innerHTML = `<i class="fas fa-check-circle"></i> Currently assigned to: ${driver.fullName} ${driver.vehicleInfo ? `(${driver.vehicleInfo})` : ''}`;
                    driverInfo.style.background = 'rgba(46,125,50,0.1)';
                    driverInfo.style.color = 'var(--admin-success)';
                }
            }
        }
    }

    function getUserName(userId) {
        const user = allUsers.find(u => u.id === userId || u._id === userId);
        return user ? user.fullName : 'Unknown User';
    }

    function getUserEmail(userId) {
        const user = allUsers.find(u => u.id === userId || u._id === userId);
        return user ? user.email : 'No email';
    }

    function getUserPhone(userId) {
        const user = allUsers.find(u => u.id === userId || u._id === userId);
        return user ? (user.phoneNumber || '—') : '—';
    }

    // ========== GET ALLOWED STATUSES ==========
    function getAllowedStatuses(currentStatus) {
        const status = (currentStatus || '').toLowerCase();
        switch (status) {
            case 'order received':
                return ['Processing', 'Cancelled'];
            case 'processing':
                return ['Out for delivery', 'Cancelled'];
            case 'out for delivery':
                return ['Delivered', 'Cancelled'];
            case 'delivered':
                return [];
            case 'cancelled':
                return [];
            default:
                return ['Processing', 'Cancelled'];
        }
    }

    function populateStatusSelect() {
        const statusSelect = document.getElementById('statusSelect');
        if (!statusSelect || !deliveryData) {
            console.log('Status select not ready');
            return;
        }
        
        const currentStatus = deliveryData.status;
        const allowedStatuses = getAllowedStatuses(currentStatus);
        const statusInfo = document.getElementById('statusInfo');
        
        console.log('Current status:', currentStatus);
        console.log('Allowed statuses:', allowedStatuses);
        
        if (allowedStatuses.length === 0) {
            statusSelect.innerHTML = '<option value="">-- No status changes available --</option>';
            statusSelect.disabled = true;
            if (statusInfo) {
                statusInfo.style.display = 'block';
                statusInfo.innerHTML = `<i class="fas fa-lock"></i> This order is ${currentStatus.toLowerCase()} and cannot be modified.`;
            }
        } else {
            statusSelect.innerHTML = '<option value="">-- Select new status --</option>';
            allowedStatuses.forEach(status => {
                const option = document.createElement('option');
                option.value = status;
                let icon = '';
                if (status === 'Processing') icon = '⚙️ ';
                else if (status === 'Out for delivery') icon = '🚚 ';
                else if (status === 'Delivered') icon = '✅ ';
                else if (status === 'Cancelled') icon = '❌ ';
                option.textContent = icon + status;
                statusSelect.appendChild(option);
            });
            statusSelect.disabled = false;
            
            if (statusInfo) {
                if (currentStatus === 'Order received') {
                    statusInfo.style.display = 'block';
                    statusInfo.innerHTML = `<i class="fas fa-info-circle"></i> You can process this order or cancel it. Processing will move it to the next stage.`;
                } else if (currentStatus === 'Processing') {
                    statusInfo.style.display = 'block';
                    statusInfo.innerHTML = `<i class="fas fa-info-circle"></i> Order is being processed. You can mark it as "Out for delivery" or cancel it.`;
                } else if (currentStatus === 'Out for delivery') {
                    statusInfo.style.display = 'block';
                    statusInfo.innerHTML = `<i class="fas fa-info-circle"></i> Order is out for delivery. You can mark it as "Delivered" or cancel it.`;
                } else {
                    statusInfo.style.display = 'none';
                }
            }
        }
    }

    // ========== FETCH DELIVERY ==========
    async function fetchDelivery() {
        if (!deliveryId) {
            showError('No delivery ID provided');
            return;
        }
        
        showLoading(true);
        
        try {
            const token = localStorage.getItem('wineBubbles_token');
            console.log('📡 Fetching delivery:', `${API_BASE}/api/deliveries/${deliveryId}`);
            
            const response = await fetch(`${API_BASE}/api/deliveries/${deliveryId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            console.log('📡 Response status:', response.status);
            
            if (!response.ok) throw new Error('Failed to load delivery');
            
            const data = await response.json();
            console.log('📦 Delivery data:', data);
            
            deliveryData = data.data || data;
            originalStatus = deliveryData.status;
            
            renderDeliveryInfo();
            populateStatusSelect();
            populateDriverSelect();
            
            // Show delete button
            const deleteBtn = document.getElementById('deleteBtn');
            if (deleteBtn) deleteBtn.style.display = 'block';
            
            // Show warning if status is locked
            if (deliveryData.status === 'Delivered' || deliveryData.status === 'Cancelled') {
                const warningContainer = document.getElementById('warningContainer');
                if (warningContainer) {
                    warningContainer.style.display = 'block';
                    warningContainer.innerHTML = `<i class="fas fa-lock"></i> This order has been ${deliveryData.status.toLowerCase()} and cannot be modified.`;
                    const updateBtn = document.getElementById('updateBtn');
                    if (updateBtn) updateBtn.disabled = true;
                }
            }
            
        } catch (error) {
            console.error('Error fetching delivery:', error);
            showError('Failed to load delivery: ' + error.message);
        } finally {
            showLoading(false);
        }
    }

    // ========== RENDER DELIVERY INFO ==========
    function renderDeliveryInfo() {
        const container = document.getElementById('deliveryInfo');
        if (!container || !deliveryData) return;
        
        const userName = getUserName(deliveryData.userId);
        const userEmail = getUserEmail(deliveryData.userId);
        const userPhone = getUserPhone(deliveryData.userId);
        const orderId = (deliveryData._id || deliveryData.id || '').substring(0, 8);
        const statusClass = getStatusClass(deliveryData.status);
        
        container.innerHTML = `
            <div class="info-section">
                <h3><i class="fas fa-user"></i> Customer Information</h3>
                <div class="info-row"><div class="info-label">Name:</div><div class="info-value">${escapeHtml(userName)}</div></div>
                <div class="info-row"><div class="info-label">Email:</div><div class="info-value">${escapeHtml(userEmail)}</div></div>
                <div class="info-row"><div class="info-label">Phone:</div><div class="info-value">${escapeHtml(userPhone)}</div></div>
            </div>
            <div class="info-section">
                <h3><i class="fas fa-shopping-cart"></i> Order #${orderId}</h3>
                <div class="info-row"><div class="info-label">Delivery Address:</div><div class="info-value">${escapeHtml(deliveryData.address || '—')}</div></div>
                <div class="info-row"><div class="info-label">Payment Method:</div><div class="info-value">${escapeHtml(deliveryData.paymentMethod || '—')}</div></div>
                <div class="info-row"><div class="info-label">Total Amount:</div><div class="info-value">R${(deliveryData.totalAmount || 0).toFixed(2)}</div></div>
                <div class="info-row"><div class="info-label">Order Date:</div><div class="info-value">${formatDateTime(deliveryData.createdAt)}</div></div>
                <div class="info-row"><div class="info-label">Current Status:</div><div class="info-value"><span class="status-badge ${statusClass}">${deliveryData.status}</span></div></div>
                ${deliveryData.driverId ? `<div class="info-row"><div class="info-label">Assigned Driver:</div><div class="info-value">${escapeHtml(getDriverName(deliveryData.driverId))}</div></div>` : '<div class="info-row"><div class="info-label">Assigned Driver:</div><div class="info-value">Not assigned</div></div>'}
            </div>
        `;
    }

    function getDriverName(driverId) {
        const driver = allDrivers.find(d => d.id == driverId);
        return driver ? driver.fullName : 'Unknown Driver';
    }

    function getStatusClass(status) {
        switch(status) {
            case 'Order received': return 'order-received';
            case 'Processing': return 'processing';
            case 'Out for delivery': return 'out-for-delivery';
            case 'Delivered': return 'delivered';
            case 'Cancelled': return 'cancelled';
            default: return 'order-received';
        }
    }

    // ========== ASSIGN DRIVER ==========
    async function assignDriverToDelivery(deliveryId, driverId) {
        if (!driverId) return true;
        
        try {
            const token = localStorage.getItem('wineBubbles_token');
            console.log('📡 Assigning driver:', `${API_BASE}/api/drivers/${driverId}/assign-delivery/${deliveryId}`);
            
            const response = await fetch(`${API_BASE}/api/drivers/${driverId}/assign-delivery/${deliveryId}`, {
                method: 'PATCH',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || 'Failed to assign driver');
            }
            
            console.log('✅ Driver assigned successfully');
            return true;
            
        } catch (error) {
            console.error('Error assigning driver:', error);
            throw error;
        }
    }

    // ========== UPDATE DELIVERY ==========
    async function updateDelivery() {
        const statusSelect = document.getElementById('statusSelect');
        const driverSelect = document.getElementById('driverSelect');
        const newStatus = statusSelect.value;
        const newDriverId = driverSelect.value ? parseInt(driverSelect.value) : null;
        
        if (!deliveryData || !deliveryId) return;
        
        // Check if anything was selected
        if ((!newStatus || newStatus === '') && newDriverId === deliveryData.driverId) {
            showError('Please select a new status or assign a driver to update');
            return;
        }
        
        // Show confirmation dialog for status change
        if (newStatus && newStatus !== originalStatus) {
            let confirmMsg = '';
            switch (newStatus) {
                case 'Processing':
                    confirmMsg = `Process this order from "${originalStatus}" to "Processing"?\n\nThis will move the order to the processing stage.`;
                    break;
                case 'Out for delivery':
                    confirmMsg = `Mark this order as "Out for delivery"?\n\nThis will notify the customer that their order is on the way.`;
                    break;
                case 'Delivered':
                    confirmMsg = `Mark this order as "Delivered"?\n\nThis will complete the order.`;
                    break;
                case 'Cancelled':
                    confirmMsg = `Cancel this order?\n\nThis will cancel the order and notify the customer.`;
                    break;
                default:
                    confirmMsg = `Change status from "${originalStatus}" to "${newStatus}"?`;
            }
            if (!confirm(confirmMsg)) return;
        }
        
        // Show driver assignment confirmation
        if (newDriverId && newDriverId !== deliveryData.driverId) {
            const driver = allDrivers.find(d => d.id == newDriverId);
            if (driver && !confirm(`Assign delivery to driver "${driver.fullName}"?`)) {
                return;
            }
        }
        
        showLoading(true);
        
        try {
            const token = localStorage.getItem('wineBubbles_token');
            let statusUpdateSuccess = true;
            
            // Handle driver assignment first using dedicated endpoint
            if (newDriverId !== deliveryData.driverId) {
                if (newDriverId) {
                    await assignDriverToDelivery(deliveryId, newDriverId);
                    console.log('✅ Driver assigned:', newDriverId);
                }
            }
            
            // Update status if changed
            if (newStatus && newStatus !== originalStatus) {
                const statusUpdateData = {
                    address: deliveryData.address,
                    status: newStatus,
                    driverId: newDriverId || deliveryData.driverId
                };
                
                console.log('📤 Updating status with:', statusUpdateData);
                
                const response = await fetch(`${API_BASE}/api/deliveries/${deliveryId}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(statusUpdateData)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to update status');
                }
            }
            
            let successMsg = '';
            if (newStatus && newStatus !== originalStatus) {
                successMsg = `Delivery status updated to "${newStatus}"`;
                if (newStatus === 'Processing') successMsg += ' - Order is now being processed.';
                else if (newStatus === 'Out for delivery') successMsg += ' - Driver has been notified.';
                else if (newStatus === 'Delivered') successMsg += ' - Order completed successfully.';
                else if (newStatus === 'Cancelled') successMsg += ' - Order has been cancelled.';
            } else if (newDriverId !== deliveryData.driverId && newDriverId) {
                successMsg = 'Driver assigned successfully';
            }
            
            showSuccess(successMsg || 'Delivery updated successfully');
            
            // Redirect after short delay
            setTimeout(() => {
                window.location.href = 'delivery_management_screen.html';
            }, 2000);
            
        } catch (error) {
            console.error('Update error:', error);
            showError('Failed to update: ' + error.message);
            showLoading(false);
        }
    }

    // ========== DELETE DELIVERY ==========
    async function deleteDelivery() {
        if (!deliveryId) return;
        
        if (!confirm(`⚠️ Permanently delete this delivery?\n\nOrder #${(deliveryData?._id || '').substring(0, 8)}\nCustomer: ${getUserName(deliveryData?.userId)}\nTotal: R${deliveryData?.totalAmount?.toFixed(2)}\n\nThis action cannot be undone.`)) return;
        
        showLoading(true);
        
        try {
            const token = localStorage.getItem('wineBubbles_token');
            const response = await fetch(`${API_BASE}/api/deliveries/${deliveryId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (!response.ok) throw new Error('Failed to delete');
            
            showSuccess('Delivery deleted successfully');
            
            setTimeout(() => {
                window.location.href = 'delivery_management_screen.html';
            }, 1500);
            
        } catch (error) {
            showError('Failed to delete: ' + error.message);
            showLoading(false);
        }
    }

    // ========== HELPER FUNCTIONS ==========
    function formatDateTime(dateStr) {
        if (!dateStr) return '—';
        try {
            const d = new Date(dateStr);
            return d.toLocaleString();
        } catch(e) { return '—'; }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function showSuccess(message) {
        const successContainer = document.getElementById('successContainer');
        if (successContainer) {
            successContainer.textContent = message;
            successContainer.style.display = 'block';
            setTimeout(() => {
                successContainer.style.display = 'none';
            }, 3000);
        }
    }

    function showError(message) {
        const errorContainer = document.getElementById('errorContainer');
        if (errorContainer) {
            errorContainer.textContent = message;
            errorContainer.style.display = 'block';
            setTimeout(() => {
                errorContainer.style.display = 'none';
            }, 5000);
        }
    }

    function showLoading(show) {
        const loadingContainer = document.getElementById('loadingContainer');
        const updateBtn = document.getElementById('updateBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        
        if (show) {
            if (loadingContainer) loadingContainer.style.display = 'flex';
            if (updateBtn) updateBtn.disabled = true;
            if (deleteBtn) deleteBtn.disabled = true;
        } else {
            if (loadingContainer) loadingContainer.style.display = 'none';
            if (updateBtn) updateBtn.disabled = false;
            if (deleteBtn) deleteBtn.disabled = false;
        }
    }

    // ========== INITIALIZE ==========
    document.getElementById('updateBtn')?.addEventListener('click', updateDelivery);
    document.getElementById('deleteBtn')?.addEventListener('click', deleteDelivery);

    if (checkAuth()) {
        fetchUsers().then(() => {
            fetchDrivers().then(() => {
                fetchDelivery();
            });
        });
    }
  </script>
</body>
</html>
