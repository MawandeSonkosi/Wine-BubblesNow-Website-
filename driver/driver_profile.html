<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Driver Profile | Wine & Bubbles Now</title>
  <link rel="icon" type="image/png" href="../assets/categories/Icons.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    :root {
      --driver-primary: #6b0d2b;
      --driver-accent: #d4af37;
      --driver-bg: #faf8f5;
      --driver-card: #ffffff;
      --driver-text: #1b1b1b;
      --driver-muted: #6d6d6d;
      --driver-border: #eae3da;
      --driver-success: #2e7d32;
    }
    body { background: var(--driver-bg); }
    .main-nav { display: none !important; }
    .top-icons { margin-left: auto; display: flex; gap: 25px; align-items: center; }
    .driver-container { max-width: 800px; margin: 30px auto 50px; padding: 0 24px; }
    
    .profile-card { background: var(--driver-card); border-radius: 24px; border: 1px solid var(--driver-border); overflow: hidden; }
    .profile-header { background: linear-gradient(135deg, var(--driver-primary) 0%, #8a1e3d 100%); padding: 40px; text-align: center; color: white; }
    .profile-avatar { width: 100px; height: 100px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    .profile-avatar i { font-size: 50px; color: var(--driver-primary); }
    .profile-name { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .profile-role { display: inline-block; padding: 4px 16px; background: rgba(255,255,255,0.2); border-radius: 20px; font-size: 12px; }
    
    .profile-content { padding: 32px; }
    .info-section { margin-bottom: 24px; }
    .info-section h3 { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--driver-primary); margin-bottom: 16px; border-bottom: 1px solid var(--driver-border); padding-bottom: 8px; }
    .info-row { display: flex; padding: 12px 0; border-bottom: 1px solid var(--driver-border); }
    .info-label { width: 140px; font-weight: 600; color: var(--driver-text); }
    .info-value { flex: 1; color: var(--driver-muted); }
    
    .btn-primary { background: var(--driver-primary); color: white; border: none; padding: 14px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; width: 100%; font-family: 'Montserrat', sans-serif; font-size: 15px; transition: all 0.2s; margin-bottom: 12px; }
    .btn-primary:hover { background: #8a1e3d; transform: translateY(-2px); }
    .btn-secondary { background: transparent; border: 1px solid var(--driver-border); padding: 12px 24px; border-radius: 40px; cursor: pointer; font-weight: 500; width: 100%; }
    .btn-secondary:hover { background: #f5f5f5; }
    .btn-danger { background: transparent; border: 1px solid #d32f2f; color: #d32f2f; }
    .btn-danger:hover { background: rgba(211,47,47,0.1); }
    
    .loading-state { text-align: center; padding: 60px; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(107,13,43,0.1); border-top-color: var(--driver-primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    
    @media (max-width: 768px) { .info-row { flex-direction: column; gap: 4px; } .info-label { width: auto; } .driver-container { padding: 0 16px; } }
  </style>
</head>
<body>
  <div class="topbar-top"><div class="topbar-top-inner"></div></div>
  <div class="topbar-main">
    <div class="topbar-main-inner">
      <div class="logo"><a href="driver_dashboard.html"><img src="../assets/categories/Logo_Top.png" alt="Logo"></a></div>
      <div class="top-icons"><a href="driver_dashboard.html" class="icon"><i class="fas fa-tachometer-alt" style="font-size:22px; color:#6b0d2b;"></i></a></div>
    </div>
  </div>

  <div class="driver-container">
    <div id="profileContent"><div class="loading-state"><div class="loading-spinner"></div><p>Loading profile...</p></div></div>
  </div>

  <footer class="footer"><div class="container footer-inner"><div class="footer-brand"><img src="../assets/categories/Logo_Botttom.png" class="footer-logo"><p class="brand-tagline">Driver Profile</p></div></div></footer>

  <script src="driver_profile.js"></script>
</body>
</html>
