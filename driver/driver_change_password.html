<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Change Password | Wine & Bubbles Now</title>
  <link rel="icon" type="image/png" href="../assets/categories/Icons.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    :root {
      --driver-primary: #6b0d2b;
      --driver-accent: #d4af37;
      --driver-bg: #faf8f5;
      --driver-card: #ffffff;
      --driver-text: #1b1b1b;
      --driver-muted: #6d6d6d;
      --driver-border: #eae3da;
      --driver-error: #d32f2f;
      --driver-success: #2e7d32;
    }
    body { background: var(--driver-bg); }
    .main-nav { display: none !important; }
    .top-icons { margin-left: auto; display: flex; gap: 25px; align-items: center; }
    .driver-container { max-width: 600px; margin: 30px auto 50px; padding: 0 24px; }
    
    .form-card { background: var(--driver-card); border-radius: 24px; border: 1px solid var(--driver-border); padding: 32px; }
    .form-title { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--driver-text); margin-bottom: 8px; }
    .form-subtitle { color: var(--driver-muted); margin-bottom: 32px; font-size: 14px; }
    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--driver-text); font-size: 14px; }
    .form-label i { margin-right: 8px; color: var(--driver-primary); }
    .form-input { width: 100%; padding: 14px 16px; border: 1px solid var(--driver-border); border-radius: 12px; font-size: 15px; font-family: 'Montserrat', sans-serif; background: white; }
    .form-input:focus { outline: none; border-color: var(--driver-primary); }
    .password-wrapper { position: relative; }
    .password-toggle { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--driver-muted); }
    .error-text { color: var(--driver-error); font-size: 12px; margin-top: 6px; display: none; }
    
    .btn-primary { background: var(--driver-primary); color: white; border: none; padding: 14px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; width: 100%; font-family: 'Montserrat', sans-serif; font-size: 15px; transition: all 0.2s; margin-top: 16px; }
    .btn-primary:hover { background: #8a1e3d; transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: transparent; border: 1px solid var(--driver-border); padding: 12px 24px; border-radius: 40px; cursor: pointer; font-weight: 500; width: 100%; margin-top: 12px; }
    .btn-secondary:hover { background: #f5f5f5; }
    
    .otp-section { background: #f8f7f5; border-radius: 16px; padding: 20px; margin-bottom: 24px; text-align: center; }
    .otp-input { font-size: 24px; letter-spacing: 8px; text-align: center; }
    .resend-link { color: var(--driver-primary); cursor: pointer; text-decoration: underline; font-size: 13px; }
    .error-message { background: rgba(211,47,47,0.1); border: 1px solid var(--driver-error); border-radius: 12px; padding: 14px; margin-bottom: 24px; color: var(--driver-error); display: none; }
    
    @media (max-width: 768px) { .form-card { padding: 24px; } }
  </style>
</head>
<body>
  <div class="topbar-top"><div class="topbar-top-inner"></div></div>
  <div class="topbar-main">
    <div class="topbar-main-inner">
      <div class="logo"><a href="driver_dashboard.html"><img src="../assets/categories/Logo_Top.png" alt="Logo"></a></div>
      <div class="top-icons"><a href="driver_dashboard.html" class="icon"><i class="fas fa-tachometer-alt" style="font-size:22px; color:#6b0d2b;"></i></a></div>
    </div>
  </div>

  <div class="driver-container">
    <div class="form-card">
      <h1 class="form-title">Change Password</h1>
      <p class="form-subtitle">Update your password</p>
      
      <div id="errorMessage" class="error-message"></div>
      
      <div id="otpSection">
        <div class="otp-section">
          <i class="fas fa-envelope" style="font-size: 40px; color: #6b0d2b; margin-bottom: 12px;"></i>
          <p>We'll send a 6-digit OTP to your email to verify your identity</p>
          <button class="btn-primary" id="sendOtpBtn">Send OTP</button>
        </div>
      </div>
      
      <div id="verifySection" style="display:none;">
        <div class="form-group">
          <label class="form-label"><i class="fas fa-key"></i> Enter OTP Code</label>
          <input type="text" id="otpCode" class="form-input otp-input" placeholder="------" maxlength="6">
          <div class="error-text" id="otpError">Please enter the 6-digit code</div>
          <p style="margin-top: 8px;"><a class="resend-link" id="resendOtpLink">Resend OTP</a></p>
        </div>
      </div>
      
      <div id="passwordSection" style="display:none;">
        <div class="form-group">
          <label class="form-label"><i class="fas fa-lock"></i> New Password</label>
          <div class="password-wrapper">
            <input type="password" id="newPassword" class="form-input" placeholder="Enter new password">
            <button type="button" class="password-toggle" id="toggleNewPwd"><i class="fas fa-eye"></i></button>
          </div>
          <div class="error-text" id="passwordError">Password must be at least 6 characters</div>
        </div>
        <div class="form-group">
          <label class="form-label"><i class="fas fa-lock"></i> Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm new password">
            <button type="button" class="password-toggle" id="toggleConfirmPwd"><i class="fas fa-eye"></i></button>
          </div>
          <div class="error-text" id="confirmError">Passwords do not match</div>
        </div>
        <button class="btn-primary" id="changePasswordBtn">Change Password</button>
      </div>
      
      <button type="button" class="btn-secondary" onclick="window.location.href='driver_profile.html'">Cancel</button>
    </div>
  </div>

  <footer class="footer"><div class="container footer-inner"><div class="footer-brand"><img src="../assets/categories/Logo_Botttom.png" class="footer-logo"><p class="brand-tagline">Change Password</p></div></div></footer>

  <script src="driver_change_password.js"></script>
</body>
</html>
