<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Change Password | Supplier Portal</title>
  <link rel="icon" type="image/png" href="../assets/categories/Icons.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    :root {
      --admin-primary: #6b0d2b;
      --admin-accent: #E6C79C;
      --admin-bg: #faf8f5;
      --admin-card: #ffffff;
      --admin-text: #1b1b1b;
      --admin-muted: #6d6d6d;
      --admin-border: #eae3da;
      --admin-success: #2e7d32;
      --admin-error: #d32f2f;
    }
    body { background: var(--admin-bg); }
    .main-nav { display: none !important; }
    .top-icons { margin-left: auto; display: flex; gap: 25px; align-items: center; }
    .admin-container { max-width: 600px; margin: 30px auto 50px; padding: 0 24px; }
    
    .form-card { background: white; border-radius: 24px; border: 1px solid var(--admin-border); padding: 32px; }
    .form-title { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--admin-text); margin-bottom: 8px; }
    .form-subtitle { color: var(--admin-muted); margin-bottom: 32px; font-size: 14px; }
    
    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--admin-text); font-size: 14px; }
    .form-label i { margin-right: 8px; color: var(--admin-primary); }
    .form-input { width: 100%; padding: 14px 16px; border: 1px solid var(--admin-border); border-radius: 12px; font-size: 15px; font-family: 'Montserrat', sans-serif; background: white; }
    .form-input:focus { outline: none; border-color: var(--admin-primary); }
    .password-input { position: relative; }
    .password-toggle { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--admin-muted); }
    
    .btn-primary { background: var(--admin-primary); color: white; border: none; padding: 14px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; width: 100%; font-family: 'Montserrat', sans-serif; font-size: 15px; transition: all 0.2s; }
    .btn-primary:hover { background: #8a1e3d; transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-secondary { background: transparent; border: 1px solid var(--admin-border); padding: 14px 24px; border-radius: 40px; cursor: pointer; font-weight: 500; width: 100%; margin-top: 12px; }
    .btn-secondary:hover { background: #f5f5f5; }
    
    .error-message { background: rgba(211,47,47,0.1); border: 1px solid var(--admin-error); border-radius: 12px; padding: 12px; margin-bottom: 24px; color: var(--admin-error); font-size: 14px; }
    .success-message { background: rgba(46,125,50,0.1); border: 1px solid var(--admin-success); border-radius: 12px; padding: 12px; margin-bottom: 24px; color: var(--admin-success); font-size: 14px; }
    .info-message { background: rgba(2,136,209,0.1); border: 1px solid #0288d1; border-radius: 12px; padding: 12px; margin-bottom: 24px; color: #0288d1; font-size: 14px; }
    
    .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(107,13,43,0.1); border-top-color: var(--admin-primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    @media (max-width: 768px) {
      .admin-container { padding: 0 16px; margin-top: 20px; }
      .form-card { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="topbar-top"><div class="topbar-top-inner"></div></div>
  <div class="topbar-main">
    <div class="topbar-main-inner">
      <div class="logo"><a href="supplier_dashboard.html"><img src="../assets/categories/Logo_Top.png" alt="Logo"></a></div>
      <div class="top-icons"><a href="#" id="userIcon"><i class="fas fa-user-circle" style="font-size:24px; color:#6b0d2b;"></i></a></div>
    </div>
  </div>

  <div class="admin-container">
    <div class="form-card">
      <h1 class="form-title">Change Password</h1>
      <p class="form-subtitle">Update your account password</p>
      
      <div id="errorMessage" class="error-message" style="display:none;"></div>
      <div id="infoMessage" class="info-message" style="display:none;"></div>
      
      <div id="step1">
        <div class="form-group">
          <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
          <input type="email" id="emailInput" class="form-input" placeholder="Your supplier email" value="">
        </div>
        <button class="btn-primary" id="sendOtpBtn"><i class="fas fa-paper-plane"></i> Send OTP</button>
      </div>
      
      <div id="step2" style="display:none;">
        <div class="form-group">
          <label class="form-label"><i class="fas fa-key"></i> Enter OTP Code</label>
          <input type="text" id="otpInput" class="form-input" placeholder="6-digit code" maxlength="6" style="text-align:center; letter-spacing:4px; font-size:20px;">
        </div>
        <button class="btn-primary" id="verifyOtpBtn"><i class="fas fa-check-circle"></i> Verify OTP</button>
        <button class="btn-secondary" id="resendOtpBtn"><i class="fas fa-redo"></i> Resend OTP</button>
      </div>
      
      <div id="step3" style="display:none;">
        <div class="form-group">
          <label class="form-label"><i class="fas fa-lock"></i> New Password</label>
          <div class="password-input">
            <input type="password" id="newPasswordInput" class="form-input" placeholder="Enter new password">
            <button type="button" class="password-toggle" onclick="togglePassword('newPasswordInput')"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label"><i class="fas fa-lock"></i> Confirm New Password</label>
          <div class="password-input">
            <input type="password" id="confirmPasswordInput" class="form-input" placeholder="Confirm new password">
            <button type="button" class="password-toggle" onclick="togglePassword('confirmPasswordInput')"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button class="btn-primary" id="resetPasswordBtn"><i class="fas fa-save"></i> Change Password</button>
        <div class="info-message" style="margin-top:16px; font-size:12px;">
          <i class="fas fa-info-circle"></i> Password must be at least 6 characters long
        </div>
      </div>
      
      <div id="step4" style="display:none; text-align:center;">
        <i class="fas fa-check-circle" style="font-size:48px; color:var(--admin-success);"></i>
        <h3 style="margin:16px 0 8px;">Password Changed!</h3>
        <p>Your password has been updated successfully. You will be redirected to login.</p>
        <div class="loading-spinner"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <img src="../assets/categories/Logo_Botttom.png" class="footer-logo">
        <p class="brand-tagline">Supplier Portal — Change Password</p>
      </div>
    </div>
  </footer>

  <script>
    const API_BASE = window.location.origin;
    let resetToken = null;
    let userEmail = '';

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    function togglePassword(inputId) {
      var input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }

    window.togglePassword = togglePassword;

    function showError(message) {
      var errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      setTimeout(function() {
        errorDiv.style.display = 'none';
      }, 5000);
    }

    function showInfo(message) {
      var infoDiv = document.getElementById('infoMessage');
      infoDiv.textContent = message;
      infoDiv.style.display = 'block';
      setTimeout(function() {
        infoDiv.style.display = 'none';
      }, 3000);
    }

    async function sendOTP() {
      var emailInput = document.getElementById('emailInput');
      var email = emailInput.value.trim().toLowerCase();
      
      if (!email) {
        showError('Please enter your email address');
        return;
      }
      
      var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showError('Please enter a valid email address');
        return;
      }
      
      userEmail = email;
      
      var sendBtn = document.getElementById('sendOtpBtn');
      sendBtn.disabled = true;
      sendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
      
      try {
        var response = await fetch(API_BASE + '/api/suppliers/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
        
        var data = await response.json();
        
        if (response.ok) {
          showInfo('OTP sent to your email!');
          document.getElementById('step1').style.display = 'none';
          document.getElementById('step2').style.display = 'block';
        } else {
          showError(data.message || 'Failed to send OTP');
        }
      } catch (error) {
        showError('Network error. Please try again.');
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
      }
    }

    async function verifyOTP() {
      var otp = document.getElementById('otpInput').value.trim();
      
      if (!otp || otp.length !== 6) {
        showError('Please enter the 6-digit OTP code');
        return;
      }
      
      var verifyBtn = document.getElementById('verifyOtpBtn');
      verifyBtn.disabled = true;
      verifyBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Verifying...';
      
      try {
        var response = await fetch(API_BASE + '/api/suppliers/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail, otp: otp })
        });
        
        var data = await response.json();
        
        if (response.ok && data.resetToken) {
          resetToken = data.resetToken;
          showInfo('OTP verified successfully!');
          document.getElementById('step2').style.display = 'none';
          document.getElementById('step3').style.display = 'block';
        } else {
          showError(data.message || 'Invalid or expired OTP');
        }
      } catch (error) {
        showError('Verification failed. Please try again.');
      } finally {
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = '<i class="fas fa-check-circle"></i> Verify OTP';
      }
    }

    async function resendOTP() {
      var resendBtn = document.getElementById('resendOtpBtn');
      resendBtn.disabled = true;
      resendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
      
      try {
        var response = await fetch(API_BASE + '/api/suppliers/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail })
        });
        
        if (response.ok) {
          showInfo('New OTP sent to your email!');
        } else {
          showError('Failed to resend OTP');
        }
      } catch (error) {
        showError('Network error. Please try again.');
      } finally {
        resendBtn.disabled = false;
        resendBtn.innerHTML = '<i class="fas fa-redo"></i> Resend OTP';
      }
    }

    async function resetPassword() {
      var newPassword = document.getElementById('newPasswordInput').value;
      var confirmPassword = document.getElementById('confirmPasswordInput').value;
      
      if (!newPassword || newPassword.length < 6) {
        showError('Password must be at least 6 characters long');
        return;
      }
      
      if (newPassword !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }
      
      var resetBtn = document.getElementById('resetPasswordBtn');
      resetBtn.disabled = true;
      resetBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Changing...';
      
      try {
        var response = await fetch(API_BASE + '/api/suppliers/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resetToken: resetToken, newPassword: newPassword })
        });
        
        if (response.ok) {
          document.getElementById('step3').style.display = 'none';
          document.getElementById('step4').style.display = 'block';
          
          localStorage.removeItem('supplier_auth_token');
          localStorage.removeItem('supplier_data');
          localStorage.removeItem('supplier_token_timestamp');
          
          setTimeout(function() {
            window.location.href = '../login/login.html';
          }, 3000);
        } else {
          var data = await response.json();
          showError(data.message || 'Failed to reset password');
          resetBtn.disabled = false;
          resetBtn.innerHTML = '<i class="fas fa-save"></i> Change Password';
        }
      } catch (error) {
        showError('Network error. Please try again.');
        resetBtn.disabled = false;
        resetBtn.innerHTML = '<i class="fas fa-save"></i> Change Password';
      }
    }

    function setupUserIcon() {
      var userIcon = document.getElementById('userIcon');
      if (userIcon) {
        userIcon.addEventListener('click', function(e) {
          e.preventDefault();
          window.location.href = 'profile.html';
        });
      }
    }

    async function checkAuth() {
      var token = localStorage.getItem('supplier_auth_token');
      if (token) {
        var supplierStr = localStorage.getItem('supplier_data');
        if (supplierStr) {
          try {
            var supplier = JSON.parse(supplierStr);
            document.getElementById('emailInput').value = supplier.email;
          } catch(e) {}
        }
      }
      setupUserIcon();
      return true;
    }

    var sendBtn = document.getElementById('sendOtpBtn');
    var verifyBtn = document.getElementById('verifyOtpBtn');
    var resendBtn = document.getElementById('resendOtpBtn');
    var resetPwdBtn = document.getElementById('resetPasswordBtn');
    
    if (sendBtn) sendBtn.addEventListener('click', sendOTP);
    if (verifyBtn) verifyBtn.addEventListener('click', verifyOTP);
    if (resendBtn) resendBtn.addEventListener('click', resendOTP);
    if (resetPwdBtn) resetPwdBtn.addEventListener('click', resetPassword);

    checkAuth();
  </script>
</body>
</html>
